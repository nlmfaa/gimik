
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Majlis Anugerah Kecemerlangan 2026</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    touch-action: manipulation;
}

#videoPlayer {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
}

/* Transparent touch layer */
#touchLayer {
    position: fixed;
    inset: 0;
    z-index: 5;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 5vh;
    background: transparent;
    cursor: pointer;
}

#startText {
    color: rgba(190,255,220,.85);
    font-family: Arial, sans-serif;
    font-size: clamp(11px, 1.5vw, 16px);
    letter-spacing: 5px;
    text-align: center;
    text-shadow: 0 0 15px #00ff91;
    animation: pulse 2s infinite;
}

@keyframes pulse {
    0%, 100% { opacity: .45; }
    50% { opacity: 1; }
}

#loading {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: none;
    align-items: center;
    justify-content: center;
    background: #000;
    color: #8affbf;
    font-family: Arial, sans-serif;
    font-size: 13px;
    letter-spacing: 4px;
}

#loading.show {
    display: flex;
}
</style>
</head>

<body>

<!-- ONE VIDEO ELEMENT FOR BOTH VIDEOS -->
<video
    id="videoPlayer"
    src="video/scannerr.mp4"
    playsinline
    webkit-playsinline
    preload="auto"
    controls="false">
</video>

<!-- Touch to start -->
<div id="touchLayer">
    <div id="startText">
        TOUCH TO ACTIVATE
    </div>
</div>

<div id="loading">
    LOADING...
</div>

<script>
const video = document.getElementById("videoPlayer");
const touchLayer = document.getElementById("touchLayer");
const startText = document.getElementById("startText");
const loading = document.getElementById("loading");

let started = false;
let secondVideo = false;

/* First touch: play scanner video */
function startExperience() {

    if (started) return;

    started = true;

    touchLayer.style.display = "none";

    video.muted = false;
    video.currentTime = 0;

    const playPromise = video.play();

    if (playPromise !== undefined) {
        playPromise.catch(() => {
            showPlayFallback();
        });
    }
}

/* Scanner video ended: play gimik video */
video.addEventListener("ended", function() {

    if (secondVideo) return;

    secondVideo = true;

    loading.classList.add("show");

    // Change the video source
    video.src = "video/gimikk.mp4";

    video.load();

    video.addEventListener("canplay", function playSecondVideo() {

        video.removeEventListener(
            "canplay",
            playSecondVideo
        );

        loading.classList.remove("show");

        video.currentTime = 0;

        video.play().catch(() => {
            showPlayFallback();
        });

    }, { once: true });

});

/* Fallback if Safari blocks playback */
function showPlayFallback() {

    loading.classList.remove("show");

    touchLayer.style.display = "flex";

    startText.textContent = secondVideo
        ? "TOUCH TO PLAY GIMIK"
        : "TOUCH TO START SCANNER";

    touchLayer.onclick = function() {

        touchLayer.style.display = "none";

        video.play().catch(() => {
            touchLayer.style.display = "flex";
        });

    };
}

/* Touch support for iPad and other devices */
touchLayer.addEventListener("pointerdown", function(event) {
    event.preventDefault();
    startExperience();
});

</script>

</body>
</html>
