
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Majlis Anugerah Kecemerlangan 2026</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #00150e;
    touch-action: none;
}

#videoPlayer {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #00150e;
    border: none;
    outline: none;
    pointer-events: none;
}

video::-webkit-media-controls,
video::-webkit-media-controls-start-playback-button {
    display: none !important;
}

#touchLayer {
    position: fixed;
    inset: 0;
    z-index: 10;
    background: transparent;
    touch-action: none;
}
</style>
</head>

<body>

<video
    id="videoPlayer"
    src="perasmian.mov"
    playsinline
    webkit-playsinline
    preload="auto"
    disablepictureinpicture
    controlslist="nodownload noplaybackrate noremoteplayback"
></video>

<div id="touchLayer"></div>

<script>

const video = document.getElementById("videoPlayer");
const touchLayer = document.getElementById("touchLayer");

let activated = false;
let videoReady = false;

// LOAD VIDEO
video.load();

// WAIT UNTIL VIDEO IS READY
video.addEventListener("loadeddata", function() {

    video.pause();
    video.currentTime = 0;
    videoReady = true;

});

// ACTIVATE WHEN SCREEN IS TOUCHED
function activateVideo(event) {

    if (event.cancelable) {
        event.preventDefault();
    }

    if (activated || !videoReady) return;

    activated = true;

    video.currentTime = 0;

    video.play().then(() => {

        // REMOVE TOUCH DETECTOR
        touchLayer.style.display = "none";

    }).catch((error) => {

        console.error("Playback error:", error);
        activated = false;

    });
}

// IPAD TOUCH
touchLayer.addEventListener("touchstart", activateVideo, {
    passive: false
});

// DESKTOP MOUSE
touchLayer.addEventListener("click", activateVideo);

// VIDEO ERROR
video.addEventListener("error", function() {
    console.error("Tidak dapat memainkan perasmian.mov");
});

</script>

</body>
</html>
