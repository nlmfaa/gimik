
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Majlis Anugerah Kecemerlangan 2026</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #00150e;
    touch-action: manipulation;
}

/* FULL SCREEN VIDEO */
#videoPlayer {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    object-fit: contain;
    background: #00150e;
    border: none;
    outline: none;
}

/* INVISIBLE TOUCH LAYER */
#touchLayer {
    position: fixed;
    inset: 0;
    z-index: 10;
    background: transparent;
    cursor: pointer;
}

/* HIDE FALLBACK MESSAGE */
#fallback {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 20;
    background: transparent;
    cursor: pointer;
}
</style>
</head>

<body>

<video
    id="videoPlayer"
    playsinline
    webkit-playsinline
    preload="auto"
    disablepictureinpicture
    controlslist="nodownload noplaybackrate noremoteplayback">
    <source src="video/scannerr.mp4" type="video/mp4">
</video>

<div id="touchLayer"></div>
<div id="fallback"></div>

<script>
const video = document.getElementById("videoPlayer");
const touchLayer = document.getElementById("touchLayer");
const fallback = document.getElementById("fallback");

let started = false;
let secondVideo = false;

// FIRST TOUCH: PLAY SCANNER VIDEO
touchLayer.addEventListener("pointerdown", function(e) {
    e.preventDefault();

    if (!started) {
        started = true;
        touchLayer.style.display = "none";

        video.play().catch(() => {
            showFallback();
        });
    } 
    else if (secondVideo) {
        video.play().catch(() => {});
        fallback.style.display = "none";
    }
});

// WHEN SCANNER VIDEO ENDS
video.addEventListener("ended", function() {

    if (!secondVideo) {
        secondVideo = true;

        video.src = "video/gimikk.mp4";
        video.load();

        video.addEventListener("canplay", function playSecond() {
            video.removeEventListener("canplay", playSecond);

            video.play().catch(() => {
                showFallback();
            });
        }, { once: true });
    }
});

// SAFARI AUTOPLAY FALLBACK
function showFallback() {
    fallback.style.display = "block";
}

// TAP IF SAFARI BLOCKS SECOND VIDEO
fallback.addEventListener("pointerdown", function(e) {
    e.preventDefault();

    video.play().then(() => {
        fallback.style.display = "none";
    }).catch(() => {});
});

// PREVENT LONG PRESS MENU
document.addEventListener("contextmenu", function(e) {
    e.preventDefault();
});
</script>

</body>
</html>
